<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HookOS Wallet</title>
<meta name="description" content="HookOS Wallet — the native client for the HookOS ecosystem.">
<style>
:root{--bg:#0b0c0e;--ink:#f4f6f8;--ink3:#8b9199;--acid:#30e000}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(48,224,0,.10),transparent 60%),var(--bg);
color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:560px}
.logo{width:72px;height:72px;border-radius:18px;margin:0 auto 28px;display:grid;place-items:center;
background:linear-gradient(135deg,rgba(48,224,0,.18),rgba(48,224,0,.04));border:1px solid rgba(48,224,0,.25)}
.logo b{color:var(--acid);font-size:34px;font-weight:800}
h1{font-size:32px;letter-spacing:-.02em;margin:0 0 12px}
p{color:var(--ink3);margin:0 auto 28px;max-width:42ch}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acid);
margin-right:8px;box-shadow:0 0 12px var(--acid)}
.tag{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink3);
border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;display:inline-block}
</style></head><body><div class="wrap">
<div class="logo"><b>H</b></div>
<h1>HookOS Wallet</h1>
<p>The native client for the HookOS ecosystem — keys, signing, launches, hooks, and cross-chain, in one wallet.</p>
<span class="tag"><span class="dot"></span>Coming soon</span>
</div></body></html>
