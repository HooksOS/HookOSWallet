# HookOS Wallet apex site (hookoswallet.xyz + www) — static landing + universal-link files.
# Own files; touches no other vhost. Cert: hookoswallet.xyz (SAN incl. www).
# Deploy: copy to /etc/nginx/sites-available/, symlink into sites-enabled/, `nginx -t && reload`.
server {
    listen 80;
    server_name hookoswallet.xyz www.hookoswallet.xyz;
    location /.well-known/acme-challenge/ { root /var/www/hookoswallet-site; }
    location / { return 301 https://hookoswallet.xyz$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.hookoswallet.xyz;
    ssl_certificate /etc/letsencrypt/live/hookoswallet.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hookoswallet.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://hookoswallet.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name hookoswallet.xyz;
    ssl_certificate /etc/letsencrypt/live/hookoswallet.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hookoswallet.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/hookoswallet-site;
    index index.html;

    # Universal-link files must be served as JSON (AASA has no extension).
    location = /.well-known/apple-app-site-association { default_type application/json; }
    location = /.well-known/assetlinks.json { default_type application/json; }

    location / { try_files $uri $uri/ =404; }
}
