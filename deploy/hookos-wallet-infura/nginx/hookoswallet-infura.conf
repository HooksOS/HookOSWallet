# HookOS WALLET-owned isolated Infura API — public vhost on hookoswallet.xyz.
# Proxies to the isolated container 127.0.0.1:18080. Own file; touches no other vhost.
# Cert: infura.hookoswallet.xyz (certbot certonly --webroot -w /var/www/hookoswallet-infura).
server {
    listen 80;
    server_name infura.hookoswallet.xyz;
    location /.well-known/acme-challenge/ { root /var/www/hookoswallet-infura; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name infura.hookoswallet.xyz;

    ssl_certificate /etc/letsencrypt/live/infura.hookoswallet.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infura.hookoswallet.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }
}
